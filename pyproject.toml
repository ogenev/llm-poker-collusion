[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "llm-poker-collusion"
version = "0.1.0"
description = "Controlled experiments on communication and coalition formation in poker"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "inspect-ai>=0.3,<0.4",
    "open-spiel>=1.6,<2",
    "openai>=3.4,<4",
]

[dependency-groups]
dev = ["mypy>=1.15,<2", "pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/poker_collusion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = "pyspiel"
ignore_missing_imports = true
